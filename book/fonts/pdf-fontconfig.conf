<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep the platform's normal font discovery for Fontconfig/Pango itself. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <!--
    The canonical PDF supplies a repository-owned, hash-pinned emoji subset.
    Pango otherwise gives an installed Noto Color Emoji face priority over an
    @font-face with the same ancestry, making pagination and bytes depend on
    mutable host state.  Reject only that external family; the internally
    renamed Cartesian face remains available through build_pdf.py's @font-face.
  -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Color Emoji</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
