<!-- Cartesian School semantic icon sprite — v2, redesigned as bold solid /
     duotone shapes (see docs/ICON-SYSTEM.md, "signal levels"). Original,
     locally-authored geometry — no external icon library. One visual
     contract: viewBox 0 0 24 24, fill="currentColor" as the base (color
     comes from CSS), primary shapes at full opacity, secondary/accent
     shapes at reduced opacity for a duotone read, and — for warning/error/
     success/game/palette/note — a single evenodd path punching real holes
     through the solid fill so the detail always shows the surface behind
     it, regardless of theme. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <!-- idea/launch/warning/debug/note below are deliberately NOT currentColor:
         these five are the "archetype" signals (lightbulb, rocket, hazard
         triangle, bug, book) that read faster in their real-world colors
         than in any single inherited hue — see docs/ICON-SYSTEM.md. Every
         other icon in this sprite stays a plain currentColor shape. -->
    <symbol id="icon-idea" viewBox="0 0 24 24">
      <g fill="#FFB020">
        <rect x="11.1" y="0.6" width="1.8" height="3.2" rx="0.9" transform="rotate(-30 12 9.5)"/>
        <rect x="11.1" y="0.2" width="1.8" height="3.2" rx="0.9"/>
        <rect x="11.1" y="0.6" width="1.8" height="3.2" rx="0.9" transform="rotate(30 12 9.5)"/>
      </g>
      <circle cx="12" cy="9.7" r="6" fill="#FFD23F"/>
      <path fill="#FFA015" fill-opacity="0.6" d="M6.4 10.7a5.6 5.6 0 0 0 11.2 0 5.6 5.6 0 0 1-11.2 0z"/>
      <ellipse cx="9.7" cy="7.2" rx="1.7" ry="1.05" fill="#FFF6D6" transform="rotate(-25 9.7 7.2)"/>
      <circle cx="16.7" cy="6.3" r="1.15" fill="#8B5CF6"/>
      <rect x="8.6" y="16.3" width="6.8" height="2.3" rx="1.15" fill="#4A4458"/>
      <rect x="9.1" y="19.1" width="5.8" height="1.9" rx="0.95" fill="#332D3D"/>
    </symbol>

    <symbol id="icon-launch" viewBox="0 0 24 24">
      <path fill="#FF8A00" d="M9.3 17.2c-1.3 1.7-1.9 3.6-1.9 5l2.6-1.6.9 2 1.1-2.3 1.1 2.3.9-2 2.6 1.6c0-1.4-.6-3.3-1.9-5z"/>
      <path fill="#FFC93C" d="M11 18.4c-.7 1-.9 2.1-.9 2.9l1.9-1.1 1.9 1.1c0-.8-.2-1.9-.9-2.9-.3.4-.6.9-1 .9s-.7-.5-1-.9z"/>
      <path fill="#E24A4F" d="M6.9 13.6L3.2 15.4l2.1 2.1z"/>
      <path fill="#E24A4F" d="M17.1 13.6l3.7 1.8-2.1 2.1z"/>
      <path fill="#F4F6FB" stroke="#C7CBDA" stroke-width="0.6" d="M12 1.6c3.1 1.9 5 5.4 5 9.3 0 2.1-.5 4-1.4 5.6H8.4c-.9-1.6-1.4-3.5-1.4-5.6 0-3.9 1.9-7.4 5-9.3z"/>
      <path fill="#FF5A5F" d="M12 1.6c1.4.85 2.55 2.05 3.4 3.5-1-.5-2.15-.8-3.4-.8s-2.4.3-3.4.8c.85-1.45 2-2.65 3.4-3.5z"/>
      <circle cx="12" cy="10.4" r="2.05" fill="#3B82F6"/>
      <circle cx="12" cy="10.4" r="1.15" fill="#BFE0FF"/>
    </symbol>

    <symbol id="icon-warning" viewBox="0 0 24 24">
      <path fill="#FFC53D" stroke="#F59E0B" stroke-width="0.9" stroke-linejoin="round" d="M12 1.9 L22.8 20.9 H1.2 Z"/>
      <path fill="#2B2016" fill-rule="evenodd" clip-rule="evenodd" d="
        M10.85 8.6 H13.15 L12.7 15.85 H11.3 Z
        M12 17.15 m-1.4 0 a1.4 1.4 0 1 0 2.8 0 a1.4 1.4 0 1 0 -2.8 0
      "/>
    </symbol>

    <symbol id="icon-success" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="
        M12 2 A10 10 0 1 0 12.01 2 Z
        M6.3 13.1 L8.55 10.75 L10.35 12.85 L16.6 6.55 L18.85 8.6 L10.6 17.35 Z
      "/>
    </symbol>

    <symbol id="icon-error" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="
        M12 2 A10 10 0 1 0 12.01 2 Z
        M7.19 9.03 L9.03 7.19 L16.81 14.97 L14.97 16.81 Z
        M16.81 9.03 L14.97 7.19 L7.19 14.97 L9.03 16.81 Z
      "/>
    </symbol>

    <symbol id="icon-debug" viewBox="0 0 24 24">
      <g stroke="#2B2036" stroke-width="2.1" stroke-linecap="round" fill="none">
        <path d="M7.6 10.1l-3.4-2.1M16.4 10.1l3.4-2.1"/>
        <path d="M7 13.6H3.1M17 13.6h3.9"/>
        <path d="M7.6 17.4l-3 2.6M16.4 17.4l3 2.6"/>
        <path d="M9.9 4.6l-1.5-2.3M14.1 4.6l1.5-2.3"/>
      </g>
      <ellipse cx="12" cy="13.6" rx="4.9" ry="5.8" fill="#E8543E"/>
      <path fill="#C43D2C" d="M7.1 13.6a4.9 5.8 0 0 0 9.8 0z"/>
      <ellipse cx="10.1" cy="10.7" rx="1.3" ry="1.7" fill="#FF9478" fill-opacity="0.9"/>
      <circle cx="12" cy="6.4" r="2.7" fill="#2B2036"/>
      <circle cx="10.9" cy="6.1" r="0.55" fill="#fff"/>
      <circle cx="13.1" cy="6.1" r="0.55" fill="#fff"/>
    </symbol>

    <symbol id="icon-experiment" viewBox="0 0 24 24">
      <path fill="currentColor" d="M9.6 2.4h4.8v1.9h-.9v4.9l4.6 8.4c.8 1.4-.2 3.1-1.8 3.1H7.7c-1.6 0-2.6-1.7-1.8-3.1l4.6-8.4V4.3h-.9z"/>
      <path fill="currentColor" fill-opacity="0.5" d="M8.6 15.2h6.8l2 3.6c.35.65-.1 1.4-.8 1.4H7.4c-.7 0-1.15-.75-.8-1.4z"/>
      <circle cx="10" cy="18.3" r="0.9" fill="#fff" fill-opacity="0.7"/>
      <circle cx="13.6" cy="19.4" r="0.7" fill="#fff" fill-opacity="0.7"/>
    </symbol>

    <symbol id="icon-timer" viewBox="0 0 24 24">
      <circle cx="12" cy="13" r="8.4" fill="currentColor" fill-opacity="0.16"/>
      <circle cx="12" cy="13" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="9.3" y="1.3" width="5.4" height="2.1" rx="1.05" fill="currentColor"/>
      <path d="M18.7 4.7l1.7-1.7 1.5 1.5-1.7 1.7z" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
        <path d="M12 13V8.4"/>
        <path d="M12 13l3.6 2.1"/>
      </g>
    </symbol>

    <symbol id="icon-practice" viewBox="0 0 24 24">
      <rect x="4.5" y="3" width="11" height="15.4" rx="1.8" fill="currentColor" fill-opacity="0.18"/>
      <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M7.2 7.4h5.6M7.2 10.6h5.6M7.2 13.8h3.4"/>
      </g>
      <path fill="currentColor" d="M15.1 13.9l4.15-4.15a1.65 1.65 0 0 1 2.35 2.35L17.45 16.25l-3 .75z"/>
      <path fill="currentColor" fill-opacity="0.55" d="M14.35 16.65l.65-2.4 1.75 1.75-2.4.65z"/>
    </symbol>

    <symbol id="icon-code" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M8.7 6.5l-5.4 5.5 5.4 5.5M15.3 6.5l5.4 5.5-5.4 5.5"/>
    </symbol>

    <symbol id="icon-file" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 3h7.3l4.7 4.7v13.1a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      <path fill="currentColor" fill-opacity="0.4" d="M13.8 3.1v3.9a1 1 0 0 0 1 1h3.9z"/>
      <g stroke="#fff" stroke-opacity="0.75" stroke-width="1.3" stroke-linecap="round">
        <path d="M7.7 13.2h8.2M7.7 16.3h6"/>
      </g>
    </symbol>

    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path fill="currentColor" fill-opacity="0.55" d="M2.8 5.8a1 1 0 0 1 1-1h5l1.9 2.3h10.5a1 1 0 0 1 1 1V8.6H2.8z"/>
      <path fill="currentColor" d="M2.8 8.3h19.4a1 1 0 0 1 .98 1.2l-1.7 9.1a1 1 0 0 1-.98.8H4.5a1 1 0 0 1-.98-.8l-1.7-9.1a1 1 0 0 1 .98-1.2z"/>
    </symbol>

    <symbol id="icon-game" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="
        M6.5 7.5 H17.5 A4.5 4.5 0 0 1 22 12 V15.5 A3 3 0 0 1 16.7 17.4 L15 15.5 H9 L7.3 17.4 A3 3 0 0 1 2 15.5 V12 A4.5 4.5 0 0 1 6.5 7.5 Z
        M6.6 10.5 H8.4 V12.1 H10 V13.9 H8.4 V15.5 H6.6 V13.9 H5 V12.1 H6.6 Z
        M15.4 10.6 m-1.1 0 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0
        M17.9 13.1 m-1.1 0 a1.1 1.1 0 1 0 2.2 0 a1.1 1.1 0 1 0 -2.2 0
      "/>
    </symbol>

    <symbol id="icon-architecture" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" rx="1.8" fill="currentColor"/>
      <rect x="13" y="3" width="8" height="8" rx="1.8" fill="currentColor" fill-opacity="0.55"/>
      <rect x="8" y="13" width="8" height="8" rx="1.8" fill="currentColor" fill-opacity="0.8"/>
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M7 11v2.3M17 11v2.3M9.9 13.9l-2.2-1.5M14.1 13.9l2.2-1.5"/>
      </g>
    </symbol>

    <symbol id="icon-palette" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="
        M12 2.2c-5.5 0-9.9 4.2-9.9 9.3 0 4 3.15 5.5 5.35 5.5.95 0 1.3-.6.8-1.4-.35-.55-.1-1.4.6-1.65.7-.25 1.4.25 1.5.95.25 1.3 1.4 2.2 2.8 2.2 4.65 0 8.7-3.95 8.7-8.9C21.9 4.9 17.6 2.2 12 2.2Z
        M7.6 10.4 m-1.55 0 a1.55 1.55 0 1 0 3.1 0 a1.55 1.55 0 1 0 -3.1 0
        M12.2 7.3 m-1.55 0 a1.55 1.55 0 1 0 3.1 0 a1.55 1.55 0 1 0 -3.1 0
        M16.9 10.4 m-1.55 0 a1.55 1.55 0 1 0 3.1 0 a1.55 1.55 0 1 0 -3.1 0
      "/>
    </symbol>

    <symbol id="icon-tools" viewBox="0 0 24 24">
      <path fill="currentColor" d="M15.1 5.3a5 5 0 0 0-6.9 5.9L3.6 15.8a1.9 1.9 0 0 0 0 2.7l1.9 1.9a1.9 1.9 0 0 0 2.7 0l4.6-4.6a5 5 0 0 0 5.9-6.9l-2.9 2.9-2.5-.6-.6-2.5z"/>
    </symbol>

    <symbol id="icon-loop" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M4.5 12a7.5 7.5 0 0 1 12.3-5.75"/>
        <path d="M19.5 12a7.5 7.5 0 0 1-12.3 5.75"/>
      </g>
      <path fill="currentColor" d="M15.7 3.4l3.3 1.2-1 3.4z"/>
      <path fill="currentColor" d="M8.3 20.6l-3.3-1.2 1-3.4z"/>
    </symbol>

    <symbol id="icon-note" viewBox="0 0 24 24">
      <path fill="#1E4FC4" d="M4.3 2.6 H19.7 A1 1 0 0 1 20.7 3.6 V20.4 A1 1 0 0 1 19.7 21.4 H4.3 A1 1 0 0 1 3.3 20.4 V3.6 A1 1 0 0 1 4.3 2.6 Z"/>
      <path fill="#FFFDF7" d="M6.1 4.4h12.6v15.2H6.1z"/>
      <rect x="7.6" y="9.2" width="9.6" height="1.5" rx="0.75" fill="#C9D6EC"/>
      <rect x="7.6" y="12.3" width="9.6" height="1.5" rx="0.75" fill="#C9D6EC"/>
      <rect x="7.6" y="15.4" width="6.6" height="1.5" rx="0.75" fill="#C9D6EC"/>
      <path fill="#F5B942" d="M9.4 2.6 H14.6 V9.4 L12 7.6 L9.4 9.4 Z"/>
    </symbol>

    <symbol id="icon-compare" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-linecap="round">
        <path stroke-width="2.4" d="M12 2.8v17.4"/>
        <path stroke-width="2.4" d="M7.4 20.2h9.2"/>
        <path stroke-width="1.9" d="M4.2 6.2h5.5M14.3 6.2H19.8"/>
      </g>
      <path fill="currentColor" fill-opacity="0.7" d="M4.2 6.2l-2.5 5.4a2.9 2.9 0 0 0 5 0z"/>
      <path fill="currentColor" fill-opacity="0.7" d="M19.8 6.2l-2.5 5.4a2.9 2.9 0 0 0 5 0z"/>
    </symbol>

    <symbol id="icon-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="7.6" r="4.1" fill="currentColor"/>
      <path fill="currentColor" fill-opacity="0.7" d="M3.6 21.4c.6-4.9 4.1-8.1 8.4-8.1s7.8 3.2 8.4 8.1a1 1 0 0 1-1 1.1H4.6a1 1 0 0 1-1-1.1z"/>
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.3" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M15.4 15.4L21 21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-device" viewBox="0 0 24 24">
      <rect x="6.3" y="1.8" width="11.4" height="20.4" rx="2.4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="19" r="1.15" fill="currentColor"/>
    </symbol>

  </defs>
</svg>
