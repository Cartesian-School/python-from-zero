     visual contract: viewBox 0 0 24 24, stroke="currentColor" so color comes
     from CSS (see .cs-icon rules in theory.css / practice.css), stroke-width
     ~1.75, round caps/joins, transparent background. Referenced via
     <svg class="cs-icon"><use href="/assets/icons/cartesian/icons.svg#icon-NAME"></use></svg>
     — see scripts/site_lib.py:cs_icon() and docs/ICON-SYSTEM.md. -->
