<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Footer light sweep B</title>
  <desc>Low-amplitude sweep threading the narrow band between the author block and the footer rule.</desc>
  <defs>
    <filter id="footer_wave_02__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g id="footer_wave_02" style="mix-blend-mode:screen">
    <path id="footer_wave_02__glow" d="M -20.0 836.0 C 190.0 844.0 430.0 816.0 680.0 834.0" stroke="#6f8cf0" stroke-width="2.70" stroke-linecap="round" opacity="0.09" filter="url(#footer_wave_02__glowFilter)"/>
    <path id="footer_wave_02__core" d="M -20.0 836.0 C 190.0 844.0 430.0 816.0 680.0 834.0" stroke="#6f8cf0" stroke-width="0.9" stroke-linecap="round" opacity="0.18"/>
  </g>
</svg>
