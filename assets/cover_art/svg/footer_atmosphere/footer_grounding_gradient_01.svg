<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Footer grounding gradient</title>
  <desc>Tonal weight at the foot of the page that anchors the composition and lifts contrast under the footer typography.</desc>
  <defs>
    <linearGradient id="footerGroundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11143a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0f1130" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0b0c24" stop-opacity="0.62"/>
    </linearGradient>
  </defs>
  <g id="footer_grounding_gradient_01">
    <rect id="footer_grounding_gradient_01__field" x="0" y="760" width="660" height="180" fill="url(#footerGroundGrad)"/>
  </g>
</svg>
