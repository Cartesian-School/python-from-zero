<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Footer light sweep A</title>
  <desc>Low-amplitude sweep threading the narrow band between the author block and the footer rule.</desc>
  <defs>
    <filter id="footer_wave_01__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g id="footer_wave_01" style="mix-blend-mode:screen">
    <path id="footer_wave_01__glow" d="M -20.0 820.0 C 150.0 802.0 390.0 840.0 680.0 812.0" stroke="#a78bfa" stroke-width="3.30" stroke-linecap="round" opacity="0.13" filter="url(#footer_wave_01__glowFilter)"/>
    <path id="footer_wave_01__core" d="M -20.0 820.0 C 150.0 802.0 390.0 840.0 680.0 812.0" stroke="#a78bfa" stroke-width="1.1" stroke-linecap="round" opacity="0.26"/>
  </g>
</svg>
