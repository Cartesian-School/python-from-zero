    <filter id="particles_bokeh_foreground_01__softFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g id="particles_bokeh_foreground_01" style="mix-blend-mode:screen" filter="url(#particles_bokeh_foreground_01__softFilter)">
    <circle id="particles_bokeh_foreground_01__p000" cx="180.0" cy="500.0" r="13.00" fill="#c4b5fd" opacity="0.10"/>
    <circle id="particles_bokeh_foreground_01__p001" cx="452.0" cy="630.0" r="17.00" fill="#67e8f9" opacity="0.08"/>
    <circle id="particles_bokeh_foreground_01__p002" cx="348.0" cy="372.0" r="10.00" fill="#ffffff" opacity="0.09"/>
  </g>
</svg>
