<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Foreground bokeh discs</title>
  <desc>Out-of-focus foreground discs providing true depth separation.</desc>
