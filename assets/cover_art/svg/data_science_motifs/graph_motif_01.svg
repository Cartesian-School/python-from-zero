<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="124" height="74" viewBox="0 0 124 74" fill="none">
  <title>Luminous plot curve motif</title>
  <desc>A single elegant analytic curve with two sample points — the GRAPH idea expressed as mathematics, with no panel, frame or label.</desc>
  <g id="graph_motif_01" style="mix-blend-mode:screen">
    <path id="graph_motif_01__curve" d="M 4 62 C 26 58 38 22 62 26 C 84 30 96 12 118 6" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
    <path id="graph_motif_01__baseline" d="M 4 68 L 118 68" stroke="#a5b4fc" stroke-width="0.8" opacity="0.28"/>
    <circle id="graph_motif_01__sample_a" cx="62" cy="26" r="2.6" fill="#ffffff" opacity="0.85"/>
    <circle id="graph_motif_01__sample_b" cx="118" cy="6" r="2.2" fill="#67e8f9" opacity="0.8"/>
  </g>
</svg>
