<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Central computational bloom</title>
  <desc>Three deliberately offset luminous lobes forming the energy zone around the Python focal point. Offsetting prevents it reading as a plain circle.</desc>
  <defs>
    <radialGradient id="glowCoreA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.62"/>
      <stop offset="0.22" stop-color="#ffd43b" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#7c5cf0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b1e8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoreB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ab6ff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#4a6fe0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#24306e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoreC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#66e6ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b6a86" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="glow_core_01" style="mix-blend-mode:screen">
    <ellipse id="glow_core_01__lobe_warm" cx="296.7" cy="520.3" rx="258.3" ry="234.4" fill="url(#glowCoreA)"/>
    <ellipse id="glow_core_01__lobe_blue" cx="373.3" cy="570.3" rx="186.5" ry="168.8" fill="url(#glowCoreB)"/>
    <ellipse id="glow_core_01__lobe_cyan" cx="240.0" cy="583.7" rx="144.9" ry="128.5" fill="url(#glowCoreC)"/>
  </g>
</svg>
