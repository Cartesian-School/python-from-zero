<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Hero depth halo</title>
  <desc>Tight radial halo placed immediately behind the Python logo to integrate it into the field and prevent a pasted-on look.</desc>
  <defs>
    <radialGradient id="coreHaloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.3"/>
      <stop offset="0.28" stop-color="#c79eff" stop-opacity="0.2"/>
      <stop offset="0.62" stop-color="#6b75fa" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#332880" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="energy_core_halo_01" style="mix-blend-mode:screen">
    <ellipse id="energy_core_halo_01__halo" cx="310.0" cy="527.0" rx="280" ry="280" fill="url(#coreHaloGrad)"/>
  </g>
</svg>
