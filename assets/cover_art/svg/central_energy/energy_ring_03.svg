<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Outer sweep ring</title>
  <desc>Broken orbital arc on a deliberately offset centre. Offsetting the centres is what keeps the core from reading as concentric rings or an atom mark.</desc>
  <g id="energy_ring_03" style="mix-blend-mode:screen">
    <ellipse id="energy_ring_03__arc" cx="270.0" cy="550.3" rx="234.4" ry="168.8" stroke="#b9a8ff" stroke-width="1.03" stroke-dasharray="273 146" stroke-linecap="round" opacity="0.3" transform="rotate(-6 270.0 550.3)"/>
  </g>
</svg>
