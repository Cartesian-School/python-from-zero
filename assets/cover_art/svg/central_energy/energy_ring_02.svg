<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Secondary tilted ring</title>
  <desc>Broken orbital arc on a deliberately offset centre. Offsetting the centres is what keeps the core from reading as concentric rings or an atom mark.</desc>
  <g id="energy_ring_02" style="mix-blend-mode:screen">
    <ellipse id="energy_ring_02__arc" cx="340.0" cy="542.3" rx="151.2" ry="136.1" stroke="#9ad8ff" stroke-width="1.13" stroke-dasharray="140 63 30 50" stroke-linecap="round" opacity="0.38" transform="rotate(31 340.0 542.3)"/>
  </g>
</svg>
