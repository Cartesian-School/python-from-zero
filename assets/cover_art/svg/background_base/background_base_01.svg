      <stop offset="0" stop-color="#120f2e"/>
      <stop offset="0.42" stop-color="#1a1246"/>
      <stop offset="0.66" stop-color="#241355"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
  </defs>
  <g id="background_base_01">
    <rect id="background_base_01__plate" x="0" y="0" width="660" height="940" fill="url(#bgBaseGround)"/>
  </g>
