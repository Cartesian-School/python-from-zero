<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Volumetric nebula texture</title>
  <desc>Multi-octave fractal-noise cloud layer tinted to the violet/blue palette. Supplies the painterly atmospheric depth of the concept.</desc>
  <defs>
    <filter id="nebulaFilter" x="-10%" y="-10%" width="120%" height="120%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0048 0.0078" numOctaves="5"
                    seed="4912" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="tinted"
        values="0.42 0.18 0.55 0 0.02
                0.20 0.30 0.72 0 0.03
                0.62 0.34 0.90 0 0.10
                0    0    0.55 0 -0.06"/>
      <feGaussianBlur in="tinted" stdDeviation="4.7"/>
    </filter>
  </defs>
  <g id="background_nebula_texture_01" style="mix-blend-mode:screen">
    <rect id="background_nebula_texture_01__field" x="0" y="0" width="660" height="940" filter="url(#nebulaFilter)" opacity="0.58"/>
  </g>
</svg>
