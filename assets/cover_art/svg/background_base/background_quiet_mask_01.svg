<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Reading-zone quiet mask</title>
  <desc>Multiply mask that lowers contrast behind the title and footer bands without crushing them to black. Enforces the quiet -> energy -> quiet rhythm.</desc>
  <defs>
    <linearGradient id="quietMaskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="0.13" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="0.28" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="0.40" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="0.92" stop-color="#000000" stop-opacity="0.46"/>
      <stop offset="1.00" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g id="background_quiet_mask_01" style="mix-blend-mode:multiply">
    <rect id="background_quiet_mask_01__mask" x="0" y="0" width="660" height="940" fill="url(#quietMaskGrad)"/>
  </g>
</svg>
