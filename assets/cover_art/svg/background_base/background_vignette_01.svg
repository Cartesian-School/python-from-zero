<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Depth vignette pair</title>
  <desc>Vertical + radial vignette that seats the composition and keeps the page edges from floating.</desc>
  <defs>
    <linearGradient id="vignetteVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161038" stop-opacity="0.52"/>
      <stop offset="0.18" stop-color="#161038" stop-opacity="0.10"/>
      <stop offset="0.74" stop-color="#12102e" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#12102e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#12102e" stop-opacity="0.58"/>
    </linearGradient>
    <radialGradient id="vignetteRadial" cx="0.47" cy="0.56" r="0.80">
      <stop offset="0.58" stop-color="#0a0820" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0820" stop-opacity="0.40"/>
    </radialGradient>
  </defs>
  <g id="background_vignette_01">
    <rect id="background_vignette_01__vertical" x="0" y="0" width="660" height="940" fill="url(#vignetteVertical)"/>
    <rect id="background_vignette_01__radial" x="0" y="0" width="660" height="940" fill="url(#vignetteRadial)"/>
  </g>
</svg>
