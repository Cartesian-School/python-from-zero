    <line id="guide_cover_grid__col_2" x1="276" y1="0" x2="276" y2="940" stroke="#7c8cff" stroke-width="0.5" opacity="0.35"/>
    <line id="guide_cover_grid__col_3" x1="384" y1="0" x2="384" y2="940" stroke="#7c8cff" stroke-width="0.5" opacity="0.35"/>
    <line id="guide_cover_grid__col_4" x1="492" y1="0" x2="492" y2="940" stroke="#7c8cff" stroke-width="0.5" opacity="0.35"/>
