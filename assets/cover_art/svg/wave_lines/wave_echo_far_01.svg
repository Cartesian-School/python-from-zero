<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Far parallax echo</title>
  <desc>Heavily blurred background echo; creates parallax depth. Glow pass + core stroke, matching the project's existing WaveGlow/WaveCore convention.</desc>
  <defs>
    <filter id="wave_echo_far_01__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8.7"/>
    </filter>
  </defs>
  <g id="wave_echo_far_01" style="mix-blend-mode:screen">
    <path id="wave_echo_far_01__glow" d="M -46.70 566.70 C 166.70 660.00 443.30 568.00 653.30 693.30" stroke="#93c5fd" stroke-width="10.54" stroke-linecap="round" opacity="0.20" filter="url(#wave_echo_far_01__glowFilter)"/>
    <path id="wave_echo_far_01__core" d="M -46.70 566.70 C 166.70 660.00 443.30 568.00 653.30 693.30" stroke="#93c5fd" stroke-width="3.40" stroke-linecap="round" opacity="0.40"/>
  </g>
</svg>
