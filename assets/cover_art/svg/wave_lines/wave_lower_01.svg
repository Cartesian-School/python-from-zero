<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Left inbound blue filament</title>
  <desc>Balances the dominant sweep on the left. Glow pass + core stroke, matching the project's existing WaveGlow/WaveCore convention.</desc>
  <defs>
    <filter id="wave_lower_01__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.7"/>
    </filter>
  </defs>
  <g id="wave_lower_01" style="mix-blend-mode:screen">
    <path id="wave_lower_01__glow" d="M -23.30 469.30 C 83.30 457.30 200.00 502.70 240.00 541.30" stroke="#93c5fd" stroke-width="4.96" stroke-linecap="round" opacity="0.35" filter="url(#wave_lower_01__glowFilter)"/>
    <path id="wave_lower_01__core" d="M -23.30 469.30 C 83.30 457.30 200.00 502.70 240.00 541.30" stroke="#93c5fd" stroke-width="1.60" stroke-linecap="round" opacity="0.70"/>
  </g>
</svg>
