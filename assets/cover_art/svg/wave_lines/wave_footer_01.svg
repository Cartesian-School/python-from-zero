<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Lower-right ascending filament</title>
  <desc>Lifts energy out of the footer field. Glow pass + core stroke, matching the project's existing WaveGlow/WaveCore convention.</desc>
  <defs>
    <filter id="wave_footer_01__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.7"/>
    </filter>
  </defs>
  <g id="wave_footer_01" style="mix-blend-mode:screen">
    <path id="wave_footer_01__glow" d="M 584.00 832.00 C 560.00 756.00 492.00 650.00 332.00 606.00" stroke="#a78bfa" stroke-width="4.65" stroke-linecap="round" opacity="0.30" filter="url(#wave_footer_01__glowFilter)"/>
    <path id="wave_footer_01__core" d="M 584.00 832.00 C 560.00 756.00 492.00 650.00 332.00 606.00" stroke="#a78bfa" stroke-width="1.50" stroke-linecap="round" opacity="0.60"/>
  </g>
</svg>
