<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="940" viewBox="0 0 660 940" fill="none">
  <title>Dominant luminous sweep</title>
  <desc>Primary gesture of the composition. Passes behind the hero. Glow pass + core stroke, matching the project's existing WaveGlow/WaveCore convention.</desc>
  <defs>
    <filter id="wave_mid_01__glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.7"/>
    </filter>
  </defs>
  <g id="wave_mid_01" style="mix-blend-mode:screen">
    <path id="wave_mid_01__glow" d="M -36.70 746.70 C 140.00 723.30 326.70 490.00 560.00 419.30" stroke="#a78bfa" stroke-width="8.37" stroke-linecap="round" opacity="0.44" filter="url(#wave_mid_01__glowFilter)"/>
    <path id="wave_mid_01__core" d="M -36.70 746.70 C 140.00 723.30 326.70 490.00 560.00 419.30" stroke="#a78bfa" stroke-width="2.70" stroke-linecap="round" opacity="0.88"/>
  </g>
</svg>
