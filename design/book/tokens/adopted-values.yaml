design_system:
  id: CARTESIAN-BOOK-METRICS-001
  status: draft-for-figma
  derived_from_reference: REFERENCE-TYPOGRAPHY-001
  visual_identity: Cartesian School

page:
  width_mm: 165
  height_mm: 235
  margins_mm:
    inner: 20
    outer: 15
  text_measure_mm: 130

rhythm:
  baseline_pt: 12
  body_font_size_pt: 10
  body_leading_pt: 12
  body_line_height_ratio: 1.20
  paragraph_spacing: compact
  web_style_large_vertical_spacing: forbidden

typography_pt:
  body: 10
  toc_entry: 9
  running_head: 9
  section_heading: 14
  major_section_heading: 16
  chapter_label: 20
  chapter_title: 24
  toc_title: 24
  code: 9
  listing_caption: 9
  table_caption: 9
  table_header: 8.5
  table_body: 8.5
  table_note: 8
  figure_caption: 8.5
  diagram_internal_min_effective: 9
  page_number: 10.5

code:
  font_class: monospace
  line_height_pt_range: [10.5, 11]
  padding_model: compact-print
  selectable_text_required: true
  screenshot_code_forbidden: true

tables:
  header_size_pt: 8.5
  body_size_pt: 8.5
  caption_size_pt: 9
  note_size_pt: 8
  cell_padding_vertical_mm_range: [1.5, 2.0]
  cell_padding_horizontal_mm_range: [2.0, 2.5]
  semantic_table_required: true

figures:
  caption_size_pt: 8.5
  diagram_internal_min_effective_pt: 9
  fragment_across_pages: false
  caption_keep_with_figure: true
  color_only_semantics: false

emoji_policy:
  enabled: true
  use: semantic-only
  max_per_heading: 1
  numbered_headings: forbidden
  unnumbered_semantic_headings: allowed
  python_specific_heading_icon: "🐍"
  note: "Only codepoints supported by the embedded font subset may be used unless the subset is explicitly extended."

identity:
  copy_reference_fonts: false
  copy_reference_colors: false
  copy_reference_decoration: false
  modern_cartesian_school_identity: true

architecture:
  canonical_pipeline_count: 1
  language_is_input_only: true
  publication_format_is_output_only: true
  locale_specific_formatting_fork: forbidden
