meta:
  id: CARTESIAN-FIGMA-BOOK-VARIABLES-001
  status: draft-for-visual-approval
  source_metrics: ../tokens/adopted-values.yaml
  figma_scale:
    px_per_mm: 4
    note: "Millimetres and points are authoritative; px values are convenience values for Figma frames only."

page:
  width_mm: 165
  height_mm: 235
  width_px: 660
  height_px: 940
  margin_inner_mm: 20
  margin_outer_mm: 15
  margin_top_mm: 18
  margin_bottom_mm: 20
  text_measure_mm: 130

spacing:
  baseline_pt: 12
  xs_mm: 1.5
  sm_mm: 2
  md_mm: 3
  lg_mm: 4
  xl_mm: 6
  xxl_mm: 9

type:
  chapter_title_pt: 24
  chapter_label_pt: 20
  major_section_pt: 16
  section_pt: 14
  body_pt: 10
  body_leading_pt: 12
  toc_entry_pt: 9
  running_head_pt: 9
  page_number_pt: 10.5
  code_pt: 9
  code_leading_min_pt: 10.5
  code_leading_max_pt: 11
  listing_caption_pt: 9
  table_caption_pt: 9
  table_header_pt: 8.5
  table_body_pt: 8.5
  table_note_pt: 8
  figure_caption_pt: 8.5
  diagram_internal_min_effective_pt: 9

components:
  code_block:
    padding_vertical_mm: 2
    padding_horizontal_mm: 2.5
  table:
    padding_vertical_mm_min: 1.5
    padding_vertical_mm_max: 2
    padding_horizontal_mm_min: 2
    padding_horizontal_mm_max: 2.5
  figure:
    keep_together: true
    caption_keep_with_figure: true

semantic_icons:
  warning: "⚠️"
  python: "🐍"
  info: "ℹ️"
  verification: "✅"
  antipattern: "❌"
  milestone: "🎉"

color_roles:
  - paper
  - text-primary
  - text-secondary
  - rule-subtle
  - brand-indigo
  - brand-violet
  - warning
  - success
  - info
  - danger
  - code-surface
  - table-header-surface

architecture:
  canonical_pipeline_count: 1
  language_input_only: true
  publication_format_output_only: true
  locale_specific_layout_fork: false
