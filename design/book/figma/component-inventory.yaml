# Illustration library — vector-native, adapted from the Cartesian School site's
# homepage hero visual language (cartesianschool.org: .hero-system / .hero-module).
# Distinct color layer (see figma-variables.yaml "illustration" tokens) from the
# interior print palette — used only on Cover, chapter-opener accents, and as a
# standalone reusable set. Never used behind body text. See HANDOFF-v1-build-log.md
# for full extraction notes and node IDs.
illustration_library:
  - Book/Illustration/CartesianGrid
  - Book/Illustration/NodeConnector
  - Book/Illustration/GraphPanel
  - Book/Illustration/CodePanel
  - Book/Illustration/AppPanel
  - Book/Illustration/GamePanel
  - Book/Illustration/HeroNetwork
  - Book/Illustration/ChapterMotif  # variant set: Theme=Graph|Code|Game|App
  # Added in the seventh (major professional refinement) round — see
  # HANDOFF-v1-build-log.md "Major professional refinement (seventh round)".
  - Book/Illustration/PythonCore  # real Python logo, vector-native, extracted from cartesianschool.org's own SVG source
  # Eighth round: the two lines above were an invented flat-vector approximation of
  # the real Cartesian School mark, correctly rejected by the Product Owner and
  # deleted. Replaced with imports of the actual repo assets in cartesian_logo/ —
  # see HANDOFF-v1-build-log.md "Integrated cover/closing redesign (eighth round)".
  - Book/Illustration/LogoSet/CartesianIcon  # real vector import of cartesian_logo/favicon.svg (358 paths, not an approximation)
  - Book/Illustration/LogoSet/CartesianLockup  # variant set: Format=Horizontal|Stacked, Theme=Dark|Light — real raster imports of cartesian_logo/logo-full-*.png and logo_bar_*.png
  - Book/Illustration/ProjectCard  # variant set: Project=paint-app|snake|bouncing-ball|space-shooter|todo-app|calculator|story-generator|rock-paper-scissors|bouncing-balls-oop|temperature-converter|notes-app|tic-tac-toe|safesort — all 13 real projects from cartesianschool.org/index.html#proekty
  - Book/Illustration/TechIcon  # variant set: Topic=Function|Loop|Conditional|List|Dict|Class|Exception|Module
  - Book/Illustration/DiagramAccent  # variant set: Piece=ArrowRight|ArrowDown|NodeDot|CornerConnector
  # Thirteenth round (full professional Cover/End Page rebuild): the twelfth
  # round's Book/Illustration/CircuitBoard was deleted outright (a failed
  # direction — margin-only, and a live bug meant it was only rendering at
  # 320x456, a corner of the page, not full size) and replaced with a
  # substantially richer full-page system. See HANDOFF-v1-build-log.md "Full
  # professional Cover/End Page rebuild (thirteenth round)".
  - Book/Illustration/MotherboardSystem  # 6-layer full-page vector data-fabric background (dot-matrix base grid, structural bus lines, LuminousFlow curved glow trajectories, CoreField dissolving-grid + concentric glow centered on the Cover hero's off-center Python core, sparse schematic node/coordinate marks replacing the seventeenth round's deleted literal chip-package layer, bold power-rail accents); Cover background
  - Book/Illustration/PortraitFrame/Cybernetic  # reusable corner-bracket + node-point + leader-tag frame, sized around a 180x225 reference portrait area; enriched with a glow halo, double-bracket corner detail, and measurement ticks; used on the End Page author portrait
  # Fourteenth round (luminous flow art direction) — see HANDOFF-v1-build-log.md
  # "Luminous flow art direction (fourteenth round)". Added a fifth layer
  # (Layer/LuminousFlow) to MotherboardSystem above: six sweeping glow-duplicate
  # bezier trajectories crossing the full page. HeroNetwork's four straight beams
  # were also converted to curved glow-duplicate connectors (same master, no new
  # component). The End Page's wave arcs were rebuilt with the same glow
  # technique, and a small margin-confined data-science atmosphere (sparkline,
  # node-link cluster, dot-grid hint) was added near the portrait — none of these
  # were promoted to standalone library components, being page-specific
  # atmosphere rather than reusable assets.
  # Fifteenth round (Cover cleanup): removed two LuminousFlow trajectories that
  # were near-vertical and spanned the full page height (reading as dirty
  # scratches, cutting through the hero/title/author/footer), two leftover
  # full-height BusLines verticals, one flow curve whose arc dipped into the gap
  # between the hero's GAME/APP panels, and one PowerRails vertical accent that
  # crossed the author credit text — 10 nodes total. Nothing added; this was a
  # subtractive cleanup only. See HANDOFF-v1-build-log.md "Cover cleanup
  # (fifteenth round)". End Page untouched this round.
  # Seventeenth round (full art-direction rebuild — Computational Core / Data
  # Fabric): the Product Owner rejected round sixteen's result as a literal
  # 2x2 dashboard-card grid around Python — a compositional failure. Rebuilt
  # HeroNetwork (88:2): deleted the old symmetric ring pair, 4 straight radial
  # beam pairs, 4 node dots, and 4 PanelGlow ellipses; the 4 GraphPanel/
  # CodePanel/GamePanel/AppPanel instances kept their real icon/label content
  # but had their rectangular card fill/stroke/divider stripped, then were
  # rescaled and repositioned asymmetrically as floating "data fragments" at
  # varying distance/scale from a rebuilt off-center Python core (new
  # Core/Disc + dashed/solid orbital rings + 3 irregular orbit nodes + 2
  # coordinate ticks). Added 4 varied-curvature Tendril glow+core pairs
  # (one dashed) replacing the old symmetric radial beams, and 4 individual
  # FragmentGlow halos. On MotherboardSystem (180:82): deleted Layer/
  # DetailZones' 105 literal chip/trace/via nodes (the "literal motherboard
  # diagram" failure condition) and replaced with 16 sparse schematic marks;
  # regenerated Layer/CoreField's concentric glow + 201-fragment dissolving
  # grid centered on the new core position. BaseGrid/BusLines/PowerRails/
  # LuminousFlow were inspected and left unchanged — already fit the intended
  # restrained aesthetic. See HANDOFF-v1-build-log.md "Full art-direction
  # rebuild — Computational Core / Data Fabric (seventeenth round)". End Page
  # inspected only, not modified.
  # Sixteenth round (Cover art-direction reconstruction, additive not subtractive):
  # removed HeroNetwork's own isolated grid/glow backdrop and hard clipping
  # boundary (the actual root cause of the "rectangle pasted in the middle"
  # effect) and replaced it with a new Layer/CoreField on MotherboardSystem — a
  # 4-stop concentric glow plus a 196-fragment radially-fading dissolving grid,
  # with no rectangular edge. Added 4 cardinal "reach-in" traces connecting the
  # background directly to the hero's core ring through the real gaps between
  # panels (8 connection points total, was 4), 3 more varied data-flow
  # trajectories plus 6 traveling-pulse markers, and an individual soft glow
  # behind each of the 4 technical panels. See HANDOFF-v1-build-log.md "Cover
  # art-direction reconstruction (sixteenth round)". End Page untouched.

# Ninth round: a distinct "editorial" tier — real photographs and print-utility
# marks, kept apart from the brand/technical/icon families above. See
# HANDOFF-v1-build-log.md "Final art direction, brand correction, QA-flow rebuild,
# authorial closing page (ninth round)" for full source provenance and
# permitted-use notes.
editorial_assets:
  - Book/Editorial/Portrait/Author  # real photo, site/assets/img/author/siergej-sobolewski.jpg (456x570)
  - Book/Editorial/Portrait/GuidoVanRossum  # real photo, site/assets/img/people/guido-van-rossum.jpg (480x640) — the same file already used in scripts/build_chapter_01.py
  # Round 10 (publication identifier block): real, verified-scannable QR code and
  # a placeholder print-registration barcode, both reserved for the End Page's
  # publication identifier panel. See HANDOFF-v1-build-log.md "Publication
  # identifier block — ISSN/barcode panel and QR code (tenth round)".
  - Book/Editorial/QRCode/CartesianSchool  # real QR encoding https://www.cartesianschool.org, decoded with pyzbar to confirm the payload before import
  - Book/Editorial/Barcode/PlaceholderISSN  # placeholder Code128 barcode, digits "0000000000000" — reserved for the final production ISSN/registration barcode

# Eleventh round (complete End Page rebuild): the four atomic assets above are
# reused as plain instances directly on Book/Page/EndPage. Deliberately NOT
# wrapped into higher-level components (e.g. "EditorialAuthorClosing",
# "PublicationIdentifier", "QRBrandLink") — the End Page is used exactly once in
# this book, so there is no second call site to justify a reusable wrapper, and
# doing so would be over-componentizing a one-off page composition. See
# HANDOFF-v1-build-log.md "Complete End Page rebuild (eleventh round)" →
# "Componentization decision".

constraints:
  locale_specific_component_forks: forbidden
  diagram_fragmentation: forbidden
  table_as_image: forbidden
  code_as_image: forbidden
  semantic_emoji_max_per_heading: 1
  emoji_before_numbered_heading: forbidden
  diagram_text_min_effective_pt: 9
