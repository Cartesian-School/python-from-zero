  # Implemented as ONE component set (Book/Component/Callout) with a "Role"
  # variant property, rather than 6 separate flat components — the more
  # correct Figma pattern (one component, one set of variants) and
  # functionally equivalent. All 6 semantic roles below are complete.
  - Book/Component/Callout/Warning
  - Book/Component/Callout/PythonInsight
  - Book/Component/Callout/Info
  - Book/Component/Callout/Verification
  - Book/Component/Callout/AntiPattern
  - Book/Component/Callout/Milestone
  - Book/Component/PracticeLinkPrint
  - Book/Component/ProjectHeader
  - Book/Component/ChapterSummary
  # Front/back matter components (added for the front/back matter system —
  # see HANDOFF-v1-build-log.md for node IDs and content provenance)
  - Book/Component/BookTitle
  - Book/Component/AuthorCredit
  - Book/Component/ImprintBlock
  - Book/Component/TOCEntry
  - Book/Component/TOCChapterEntry
  - Book/Component/TOCSectionEntry
  - Book/Component/IndexEntry
  - Book/Component/ColophonBlock

# Illustration library — vector-native, adapted from the Cartesian School site's
# homepage hero visual language (cartesianschool.org: .hero-system / .hero-module).
# Distinct color layer (see figma-variables.yaml "illustration" tokens) from the
# interior print palette — used only on Cover, chapter-opener accents, and as a
# standalone reusable set. Never used behind body text. See HANDOFF-v1-build-log.md
# for full extraction notes and node IDs.
illustration_library:
  - Book/Illustration/CartesianGrid
  - Book/Illustration/NodeConnector
  - Book/Illustration/GraphPanel
  - Book/Illustration/CodePanel
  - Book/Illustration/AppPanel
  - Book/Illustration/GamePanel
  - Book/Illustration/HeroNetwork
  - Book/Illustration/ChapterMotif  # variant set: Theme=Graph|Code|Game|App

constraints:
  locale_specific_component_forks: forbidden
  diagram_fragmentation: forbidden
  table_as_image: forbidden
  code_as_image: forbidden
  semantic_emoji_max_per_heading: 1
  emoji_before_numbered_heading: forbidden
  diagram_text_min_effective_pt: 9
