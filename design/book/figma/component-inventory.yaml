meta:
  id: CARTESIAN-FIGMA-BOOK-COMPONENTS-001
  status: draft-for-visual-approval

# Front/back matter naming note (see HANDOFF-v1-build-log.md "Front & back matter
# system" section for full detail, node IDs, and source-content provenance):
# the pages actually implemented in Figma use the names given in a later,
# more specific build instruction and differ from a few of this file's
# original placeholder names below:
#   Book/Page/FrontCover -> implemented as Book/Page/Cover
#   Book/Page/HalfTitle  -> not implemented as a separate page from Title
#                           (no distinct half-title content exists in the book)
#   Book/Page/Preface    -> implemented as Book/Page/FromAuthor, using the
#                           book's real "Введение" (Introduction) content —
#                           a distinct "From the Author" preface does not
#                           exist separately in the source, so this avoids
#                           inventing content or duplicating the same text
#                           under two archetypes
#   Book/Page/Contents   -> implemented as Book/Page/TOC (+ TOCContinuation,
#                           since the book's real 24-chapter TOC does not
#                           fit a single page at approved type sizes)
# Additional back-matter pages beyond this original list were implemented per
# the later instruction: Book/Page/AboutCartesianSchool, Book/Page/Colophon,
# Book/Page/EndPage. Book/Page/ConclusionOrFinalWord, Book/Page/Glossary, and
# Book/Page/References were evaluated and marked N/A/deferred — no such
# distinct content exists in the book (see HANDOFF log for the audit).
pages:
  - Book/Page/Cover
  - Book/Page/Title
  - Book/Page/Copyright
  - Book/Page/AboutAuthor
  - Book/Page/FromAuthor
  - Book/Page/TOC
  - Book/Page/TOCContinuation
  - Book/Page/ChapterOpener
  - Book/Page/Standard
  - Book/Page/ProseCode
  - Book/Page/CodeHeavy
  - Book/Page/Figure
  - Book/Page/Diagram
  - Book/Page/Table
  - Book/Page/CalloutRich
  - Book/Page/Practice
  - Book/Page/ProjectOpener
  - Book/Page/ChapterSummary
  - Book/Page/Index
  - Book/Page/AboutCartesianSchool
  - Book/Page/Colophon
  - Book/Page/EndPage

typography:
  - Book/Typography/ChapterTitle
  - Book/Typography/ChapterLabel
  - Book/Typography/MajorSection
  - Book/Typography/Section
